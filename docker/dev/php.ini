display_errors=On
error_reporting=E_ALL

; Opcache aktif di dev (T1.6): tanpa ini setiap request mengompilasi ulang ratusan berkas Laravel/Filament.
; validate_timestamps=1 + revalidate_freq=2 → perubahan kode tetap terbaca (paling lambat 2 dtk) tanpa memeriksa berkas tiap request.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.file_update_protection=0
realpath_cache_size=4096K
realpath_cache_ttl=120
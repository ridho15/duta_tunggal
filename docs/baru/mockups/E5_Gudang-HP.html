<!doctype html><html lang='id'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>E5. Checker gudang di HP</title></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15803d}a:hover{color:#14532d}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; color: #111827; background: #f6f7f8; display: flex; flex-direction: column">
<header style="height: 52px; background: #ffffff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 14px">
<a href="#" style="color: #374151; text-decoration: none; font-weight: 600">‹ Kiriman (3)</a>
<span style="font-size: 9px; font-weight: 700; color: #15803d; border: 1px solid #86efac; background: #f0fdf4; border-radius: 4px; padding: 1px 5px">CHECKER</span>
</header>

<div style="padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
<span style="align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .6px; color: #15803d; background: #f0fdf4; border: 1px solid #86efac; border-radius: 6px; padding: 4px 9px">DUTA-K01.2</span>
<div>
<h1 style="margin: 0; font-size: 24px; font-weight: 800">DO-0007-02</h1>
<div style="font-size: 13px; color: #6b7280">untuk DAYA TEKNIK MEDIKA · ambil barang, cek, lalu centang</div>
</div>

<label style="display: flex; gap: 14px; align-items: center; background: #f0fdf4; border: 1px solid #86efac; border-radius: 14px; padding: 16px">
<input type="checkbox" checked="checked" style="width: 26px; height: 26px; accent-color: #15803d">
<span style="flex-grow: 1">
<span style="display: block; font-size: 16px; font-weight: 700">COPPER ELBO 5/8''</span>
<span style="display: block; font-size: 12px; color: #6b7280">ETBG000016</span>
</span>
<span style="font-size: 24px; font-weight: 800">3<span style="font-size: 13px; font-weight: 500; color: #6b7280"> pcs</span></span>
</label>

<label style="display: flex; gap: 14px; align-items: center; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px">
<input type="checkbox" style="width: 26px; height: 26px; accent-color: #15803d">
<span style="flex-grow: 1">
<span style="display: block; font-size: 16px; font-weight: 700">COPPER ELBO 1/2''</span>
<span style="display: block; font-size: 12px; color: #6b7280">ETBG000013</span>
</span>
<span style="font-size: 24px; font-weight: 800">4<span style="font-size: 13px; font-weight: 500; color: #6b7280"> pcs</span></span>
</label>

<div style="font-size: 13px; color: #6b7280; text-align: center">1 dari 2 barang sudah dicek</div>
<div style="flex-grow: 1"></div>

<button type="button" disabled="disabled" style="font-family: inherit; font-size: 17px; font-weight: 700; padding: 16px; border-radius: 14px; border: 1px dashed #d1d5db; background: #f3f4f6; color: #9ca3af; min-height: 56px">Semua sesuai – KIRIM</button>
<div style="font-size: 12px; color: #6b7280; text-align: center; margin-top: -4px">Centang semua barang dulu untuk mengirim</div>
<button type="button" style="font-family: inherit; font-size: 15px; font-weight: 700; padding: 14px; border-radius: 14px; border: 1px solid #fcd34d; background: #fffbeb; color: #92400e; min-height: 52px">Ada kurang / rusak</button>
</div>
</div>
